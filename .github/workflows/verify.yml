name: verify

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'jsonschema>=4.10,<5'
      - run: PYTHONPATH=src python -m unittest discover -v
      - run: python scripts/validate_policy_docs.py
      - run: PYTHONPATH=src python -m tool_repository milestones validate
      - run: PYTHONPATH=src python -m tool_repository validate --require-knowledge
      - run: PYTHONPATH=src python -m tool_repository repositories validate-queue
